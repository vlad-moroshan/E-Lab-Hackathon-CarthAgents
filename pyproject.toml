[project]
name = "carth"
version = "0.1.0"
description = "CarthAgents: zero-hallucination extraction of fixed-asset schedules"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pypdfium2>=4.30",
    "pillow>=10",
    "openai>=1.60",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
# installed on Colab / a GPU box only
ocr = ["paddleocr>=3.0", "python-doctr>=0.10"]

[project.scripts]
carth = "carth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carth"]
