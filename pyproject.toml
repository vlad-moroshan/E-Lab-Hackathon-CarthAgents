[project]
name = "carth"
version = "0.1.0"
description = "CarthAgents: zero-hallucination extraction of fixed-asset schedules"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pypdfium2>=4.30",
    "pillow>=10",
    "openai>=1.60",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "jsonschema==4.25.1",
    "reportlab>=4.2",  # imported by the organisers' check_corpus.py (via core.py)
]

[project.optional-dependencies]
# CPU OCR stack verified with Python 3.12; keep the runtime explicit.
ocr = [
    "numpy==2.3.5",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
]
# Experimental engines also need the ocr extra for shared page orientation.
doctr = ["python-doctr==1.1.0"]
tesseract = ["pytesseract==0.3.13"]

[project.scripts]
carth = "carth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carth"]
