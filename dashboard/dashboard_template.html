<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extraction Evaluation</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ef; --border: rgba(11,11,11,0.10);
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --neutral: #b4b2aa;
  --good-text: #006300; --bad-text: #b02a2a; --accent-wash: rgba(42,120,214,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --border: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --neutral: #5c5b57; --good-text: #0ca30c; --bad-text: #e66767; --accent-wash: rgba(57,135,229,0.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --border: rgba(255,255,255,0.10);
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --neutral: #5c5b57; --good-text: #0ca30c; --bad-text: #e66767; --accent-wash: rgba(57,135,229,0.16);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
nav.side { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; position: sticky; top: 0;
  height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.brand { font-weight: 650; font-size: 15px; padding: 0 10px 2px; }
.brand-sub { color: var(--muted); font-size: 12px; padding: 0 10px 16px; }
.nav-h { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 14px 10px 4px; }
nav.side a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--ink-2);
  text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav.side a:hover { background: var(--surface-2); color: var(--ink); }
nav.side a[aria-current="page"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.side-foot { margin-top: auto; color: var(--muted); font-size: 12px; padding: 16px 10px 0; display: flex; flex-direction: column; gap: 8px; }
.side-foot button { align-self: flex-start; font: inherit; color: var(--ink-2); background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
main { padding: 28px 32px 64px; max-width: 1240px; width: 100%; }
h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; }
.lede { color: var(--ink-2); margin: 0 0 22px; max-width: 760px; }
h2 { font-size: 15px; margin: 0 0 2px; font-weight: 620; }
.card-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid2 > .card { margin-bottom: 0; }
.grid2 { margin-bottom: 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
.tile-h { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 560; min-width: 0; }
.tile-h span.l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-v { font-size: 30px; font-weight: 640; margin: 6px 0 0; letter-spacing: -.01em; }
.tile-s { color: var(--muted); font-size: 12.5px; }
.tile-row { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
.tile-row b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--good-text);
  border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; margin-left: auto; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 10px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart { width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--ink-2); font-size: 12px; }
.chart text.muted { fill: var(--muted); font-size: 11px; }
.chart rect.mark { cursor: default; }
.chart rect.mark:hover, .chart rect.mark:focus { filter: brightness(1.12); outline: none; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--muted); font-weight: 560; font-size: 12px; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--surface-2); }
td.best { font-weight: 650; color: var(--ink); }
td.best::after { content: " ✓"; color: var(--good-text); }
.pos { color: var(--good-text); }
.neg { color: var(--bad-text); }
.dim { color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 5px; }
.status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
details.tbl { margin-top: 10px; }
details.tbl summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
details.tbl table { margin-top: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.filters select, .filters input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; min-width: 0; }
.filters input { width: 220px; max-width: 100%; }
a.doclink { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--axis); }
a.doclink:hover { border-color: var(--ink); }
.issue { font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid var(--grid); color: var(--ink-2); white-space: normal; }
.issue b { color: var(--ink); font-weight: 600; }
.empty { color: var(--muted); padding: 10px 0; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; max-width: 280px; }
#tip .tv { font-weight: 650; font-size: 14px; font-variant-numeric: tabular-nums; }
#tip .tk { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
#tip .tk i { width: 12px; height: 2px; display: inline-block; border-radius: 1px; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 10px 16px; gap: 4px;
    border-right: 0; border-bottom: 1px solid var(--border); align-items: center; }
  .brand-sub, .nav-h, .side-foot { display: none; }
  .brand { padding: 0 10px 0 0; white-space: nowrap; }
  nav.side a { flex: none; }
  main { padding: 20px 16px 48px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="tip" role="tooltip"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const RUN = DATA.run;
const COLOR = "var(--s1)";
const OUTCOMES = [
  { key: "correct", label: "Correct (+1)", color: "var(--good)" },
  { key: "blank", label: "Flagged blank (0)", color: "var(--neutral)" },
  { key: "missing", label: "Missing", color: "var(--warning)" },
  { key: "wrong", label: "Wrong (−3)", color: "var(--critical)" },
];
const FORMAT_ORDER = ["scan", "outline", "pdf", "xlsx"];
const FORMAT_LABEL = { scan: "Scanned PDF", outline: "PDF without text layer", pdf: "PDF with text layer", xlsx: "Excel" };
const CHECKS = ["schema", "laws", "totals", "pointers", "completeness"];
const CHECK_LABEL = { schema: "Schema", laws: "Row laws", totals: "Totals tie", pointers: "Pointer re-read", completeness: "Completeness" };

// ------------------------------------------------------------------ helpers
const $ = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
const NS = "http://www.w3.org/2000/svg";
const S = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const n0 = (v) => v == null ? "–" : Number(v).toLocaleString("en-US");
const p1 = (v) => v == null ? "–" : `${Number(v).toFixed(1)}%`;
const pct = (a, b) => b ? 100 * a / b : null;
const sw = (color) => $("span", { class: "sw", style: `background:${color}` });
const sum = (o, keys) => keys.reduce((s, k) => s + (o?.[k] || 0), 0);

function card(title, sub, ...body) {
  return $("section", { class: "card" }, $("h2", { text: title }), sub ? $("p", { class: "card-sub", text: sub }) : null, ...body);
}
function legend(items) {
  return $("div", { class: "legend" }, items.map(it => $("span", {}, sw(it.color), it.label)));
}
function table(headers, rows, opts = {}) {
  // headers: [{label, num, key}] ; rows: arrays of cells (string | Node | {v, text, cls})
  const thead = $("thead", {}, $("tr", {}, headers.map((h, i) => $("th", {
    class: [h.num ? "num" : "", opts.sortable ? "sortable" : ""].join(" ").trim() || null, text: h.label,
    onclick: opts.sortable ? () => sortBy(i) : null,
  }))));
  const tbody = $("tbody");
  let dir = {};
  const fill = (rs) => {
    tbody.replaceChildren(...rs.map(r => $("tr", {}, r.map((c, i) => {
      const cell = (c && typeof c === "object" && !c.nodeType) ? c : { text: c };
      const td = $("td", { class: [headers[i]?.num ? "num" : "", cell.cls || ""].join(" ").trim() || null });
      if (cell.node) td.append(cell.node); else if (cell.text != null && cell.text.nodeType) td.append(cell.text);
      else td.textContent = cell.text == null ? "" : String(cell.text);
      return td;
    }))));
  };
  const sortBy = (i) => {
    dir[i] = !dir[i];
    const val = (c) => (c && typeof c === "object" && !c.nodeType) ? (c.v ?? c.text) : c;
    const rs = [...rows].sort((a, b) => {
      const x = val(a[i]), y = val(b[i]);
      if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * (dir[i] ? 1 : -1);
    });
    fill(rs);
  };
  fill(rows);
  return $("div", { class: "tablewrap" }, $("table", {}, thead, tbody));
}
function asTable(headers, rows) {
  return $("details", { class: "tbl" }, $("summary", { text: "Show as table" }), table(headers, rows));
}

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById("tip");
function showTip(ev, value, label, color, extra) {
  tip.replaceChildren($("div", { class: "tv", text: value }),
    $("div", { class: "tk" }, color ? $("i", { style: `background:${color}` }) : null, label),
    extra ? $("div", { class: "tk", text: extra }) : null);
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (ev.type === "focus") { const b = ev.target.getBoundingClientRect(); x = b.right + 8; y = b.top; }
  if (x + r.width > innerWidth - 8) x = Math.max(8, (ev.clientX || x) - r.width - 14);
  if (y + r.height > innerHeight - 8) y = Math.max(8, innerHeight - r.height - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };
function hover(el, value, label, color, extra) {
  el.setAttribute("tabindex", "0");
  el.setAttribute("aria-label", `${label}: ${value}`);
  const show = (ev) => showTip(ev, value, label, color, extra);
  el.addEventListener("pointermove", show); el.addEventListener("focus", show);
  el.addEventListener("pointerleave", hideTip); el.addEventListener("blur", hideTip);
}

// ------------------------------------------------------------------ charts (inline SVG, re-drawn on resize)
const charts = [];
function chart(draw) {
  const el = $("div", { class: "chart" });
  charts.push({ el, draw });
  requestAnimationFrame(() => draw(el, el.clientWidth || 600));
  return el;
}
let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => charts.forEach(c => c.el.isConnected && c.draw(c.el, c.el.clientWidth)), 120); });

/** Shorten a label to the width it has (about 6.6px per character at 12px). */
const fit = (label, px) => { const n = Math.floor(px / 6.6); return label.length > n ? label.slice(0, Math.max(n - 1, 3)) + "…" : label; };
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

/** Horizontal grouped bars: one group per category, one bar per series. values may be null (no data). */
function groupedBars({ cats, series, fmt = p1, domain, labelW = 150, tickFmt }) {
  return chart((el, W) => {
    const barH = 12, gap = 2, groupPad = 14, n = series.length;
    const lw = Math.min(labelW, Math.max(90, W * 0.32));
    const groupH = n * barH + (n - 1) * gap;
    const H = cats.length * (groupH + groupPad) + 26;
    const vals = series.flatMap(s => s.values).filter(v => v != null);
    let [lo, hi] = domain || [Math.min(0, ...vals), Math.max(0, ...vals)];
    if (hi === lo) hi = lo + 1;
    const ticks = niceTicks(lo, hi); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
    const x0 = lw + 8, x1 = W - 12, sx = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);
    const svg = S("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
    for (const t of ticks) {
      svg.append(S("line", { x1: sx(t), x2: sx(t), y1: 0, y2: H - 20, stroke: "var(--grid)", "stroke-width": 1 }));
      const tx = S("text", { x: sx(t), y: H - 6, "text-anchor": "middle", class: "muted" }); tx.textContent = (tickFmt || fmt)(t); svg.append(tx);
    }
    svg.append(S("line", { x1: sx(0), x2: sx(0), y1: 0, y2: H - 20, stroke: "var(--axis)", "stroke-width": 1 }));
    cats.forEach((c, ci) => {
      const gy = ci * (groupH + groupPad) + 4;
      const lab = S("text", { x: lw, y: gy + groupH / 2 + 4, "text-anchor": "end" });
      lab.textContent = fit(c.label, lw); svg.append(lab);
      series.forEach((s, si) => {
        const v = s.values[ci]; const y = gy + si * (barH + gap);
        if (v == null) {
          const t = S("text", { x: sx(0) + 4, y: y + barH - 2, class: "muted" }); t.textContent = "no data"; svg.append(t); return;
        }
        const a = sx(Math.min(0, v)), b = sx(Math.max(0, v)), w = Math.max(b - a, 1.5);
        const r = Math.min(4, w / 2, barH / 2);
        // rounded at the data end only, square at the baseline
        const path = v >= 0
          ? `M${a},${y}H${a + w - r}Q${a + w},${y} ${a + w},${y + r}V${y + barH - r}Q${a + w},${y + barH} ${a + w - r},${y + barH}H${a}Z`
          : `M${b},${y}H${a + r}Q${a},${y} ${a},${y + r}V${y + barH - r}Q${a},${y + barH} ${a + r},${y + barH}H${b}Z`;
        const m = S("path", { d: path, fill: s.color, class: "mark" });
        hover(m, fmt(v), `${s.label} · ${c.label}`, s.color, s.extra ? s.extra[ci] : null);
        svg.append(m);
        // invisible larger hit target
        const hit = S("rect", { x: Math.min(a, b) - 2, y: y - 1, width: w + 4, height: barH + 2, fill: "transparent" });
        hover(hit, fmt(v), `${s.label} · ${c.label}`, s.color, s.extra ? s.extra[ci] : null); hit.setAttribute("tabindex", "-1");
        svg.append(hit);
      });
    });
    el.replaceChildren(svg);
  });
}

/** Dot plot for close percentages: one row per category, one dot per series on its own lane.
 *  The axis is zoomed to the data (dots, unlike bars, need no zero baseline). */
function dotPlot({ cats, series, fmt = p1, labelW = 150, hi = 100 }) {
  return chart((el, W) => {
    const n = series.length, lane = 9, rowPad = 14, r = 5;
    const rowH = Math.max(n * lane, 18);
    const lw = Math.min(labelW, Math.max(90, W * 0.32));
    const H = cats.length * (rowH + rowPad) + 26;
    const vals = series.flatMap(s => s.values).filter(v => v != null);
    const vmin = vals.length ? Math.min(...vals) : 0;
    const ticks = niceTicks(Math.min(vmin, hi - 1) - 0.5, hi, 5);
    const lo = Math.min(ticks[0], vmin), top = Math.max(hi, ticks[ticks.length - 1]);
    const x0 = lw + 14, x1 = W - 14, sx = v => x0 + (v - lo) / (top - lo || 1) * (x1 - x0);
    const svg = S("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
    for (const t of ticks) {
      svg.append(S("line", { x1: sx(t), x2: sx(t), y1: 0, y2: H - 20, stroke: "var(--grid)", "stroke-width": 1 }));
      const tx = S("text", { x: sx(t), y: H - 6, "text-anchor": "middle", class: "muted" }); tx.textContent = fmt(t); svg.append(tx);
    }
    cats.forEach((c, ci) => {
      const gy = ci * (rowH + rowPad) + 4;
      const lab = S("text", { x: lw, y: gy + rowH / 2 + 4, "text-anchor": "end" });
      lab.textContent = fit(c.label, lw); svg.append(lab);
      svg.append(S("line", { x1: x0, x2: x1, y1: gy + rowH / 2, y2: gy + rowH / 2, stroke: "var(--grid)", "stroke-width": 1 }));
      const pts = series.map((s, si) => [s, s.values[ci], gy + (rowH - (n - 1) * lane) / 2 + si * lane]).filter(([, v]) => v != null);
      if (pts.length > 1) {
        const xs = pts.map(([, v]) => sx(v));
        svg.append(S("line", { x1: Math.min(...xs), x2: Math.max(...xs), y1: gy + rowH / 2, y2: gy + rowH / 2, stroke: "var(--axis)", "stroke-width": 2 }));
      }
      for (const [s, v, y] of pts) {
        const dot = S("circle", { cx: sx(v), cy: y, r, fill: s.color, stroke: "var(--surface)", "stroke-width": 2, class: "mark" });
        hover(dot, fmt(v), `${s.label} · ${c.label}`, s.color);
        svg.append(dot);
        const hit = S("circle", { cx: sx(v), cy: y, r: 12, fill: "transparent" });
        hover(hit, fmt(v), `${s.label} · ${c.label}`, s.color); hit.setAttribute("tabindex", "-1");
        svg.append(hit);
      }
    });
    el.replaceChildren(svg);
  });
}

/** One stacked bar per row (rows = methods), segments = outcomes; a count scale shared by all rows. */
function stackedRows({ rows, segs }) {
  return chart((el, W) => {
    const barH = 18, pad = 16, lw = Math.min(150, Math.max(90, W * 0.28));
    const H = rows.length * (barH + pad) + 4;
    const x0 = lw + 8, x1 = W - 64;
    const svg = S("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
    const rowTot = (r) => segs.reduce((s, g) => s + (r.values[g.key] || 0), 0);
    const tot = Math.max(...rows.map(rowTot), 1);
    rows.forEach((r, ri) => {
      const y = ri * (barH + pad) + 4;
      const lab = S("text", { x: lw, y: y + barH / 2 + 4, "text-anchor": "end" }); lab.textContent = r.label; svg.append(lab);
      const end = S("text", { x: x0 + rowTot(r) / tot * (x1 - x0) + 6, y: y + barH / 2 + 4 }); end.textContent = n0(rowTot(r)); svg.append(end);
      let x = x0;
      const parts = segs.filter(g => r.values[g.key]);
      parts.forEach((g, gi) => {
        const v = r.values[g.key]; const w = (v / tot) * (x1 - x0);
        const gapR = gi < parts.length - 1 ? 2 : 0;
        const m = S("rect", { x, y, width: Math.max(w - gapR, 1), height: barH, fill: g.color, class: "mark",
          rx: (gi === parts.length - 1 || gi === 0) ? 3 : 0 });
        hover(m, n0(v), `${r.label} · ${g.label}`, g.color, g.key === "wrong" ? `${n0(3 * v)} points lost` : null);
        svg.append(m); x += w;
      });
    });
    el.replaceChildren(svg);
  });
}

// ------------------------------------------------------------------ data access
const S_ = RUN.summary, T = S_.total || {};
const DOCS = Object.fromEntries(RUN.docs.map(d => [d.id, d]));
const FAMILIES = Object.keys(S_.by_family || {}).sort();
const FORMATS = (() => { const s = new Set(Object.keys(S_.by_format || {})); return [...FORMAT_ORDER.filter(f => s.has(f)), ...[...s].filter(f => !FORMAT_ORDER.includes(f))]; })();
const VARIANTS = Object.keys(S_.by_variant || {}).sort();
const one = (values) => [{ label: RUN.label, color: COLOR, values }];
const plantedCount = (c) => `${c.pass || 0} / ${(c.pass || 0) + (c.fail || 0)}`;
const docErrors = (d) => CHECKS.reduce((s, ch) => s + (d.checks?.[ch]?.error || 0), 0);

// ------------------------------------------------------------------ pages
function tile(head, value, sub) {
  return $("div", { class: "tile" }, $("div", { class: "tile-h", text: head }), $("div", { class: "tile-v", text: value }), $("div", { class: "tile-s", text: sub }));
}

function pageOverview() {
  const out = [];
  const keyed = !!T.values;
  out.push($("h1", { text: "Overview" }),
    $("p", { class: "lede" }, `${RUN.label} · `, $("code", { text: RUN.path }), ` · evaluated ${RUN.built} · ${RUN.docs.length} documents. `,
      "Scored with the challenge rule: +1 per correct value, 0 per flagged blank, −3 per wrong value."));

  const prec = (T.correct + T.wrong) ? 100 * T.correct / (T.correct + T.wrong) : null;
  const pr = S_.pointer_reread || {}, co = S_.completeness || {};
  out.push($("div", { class: "tiles" },
    tile("Score", keyed ? p1(T.score_pct) : "no key", keyed ? `${n0(T.score)} of ${n0(T.values)} values` : "no answer keys for these documents"),
    tile("Wrong values", n0(T.wrong ?? 0), "each costs 3 points"),
    tile("Flagged blanks", n0(T.blank ?? 0), "score 0"),
    tile("Precision", p1(prec), "correct among the values kept"),
    tile("Pointer re-read", `${n0(pr.failed ?? 0)} failed`, `${n0(pr.verified)} verified · ${n0(pr.unverifiable)} without text layer`),
    tile("Lines not in output", n0(co.uncovered ?? 0), `of ${n0(co.data_lines)} schedule lines in the sources`)));

  if (keyed) {
    out.push($("div", { class: "grid2" },
      card("Values that did not score +1", "Flagged blanks cost nothing, missing values score 0, each wrong value costs 3 points.",
        legend(OUTCOMES.slice(1)), stackedRows({ rows: [{ label: RUN.label, values: T }], segs: OUTCOMES.slice(1) }),
        asTable([{ label: "Outcome" }, { label: "Values", num: true }], OUTCOMES.map(o => [o.label, n0(T[o.key] || 0)]))),
      card("Score by document format", "Scans and PDFs without a text layer are where OCR decides the result. Axis zoomed to the data.",
        dotPlot({ cats: FORMATS.map(f => ({ label: FORMAT_LABEL[f] || f })), series: one(FORMATS.map(f => S_.by_format[f]?.score_pct ?? null)) }),
        asTable([{ label: "Format" }, { label: "Score %", num: true }, { label: "Wrong", num: true }], FORMATS.map(f => [FORMAT_LABEL[f] || f, p1(S_.by_format[f]?.score_pct), n0(S_.by_format[f]?.wrong || 0)])))));

    out.push(card("Score by layout family", "The hidden test set uses layouts nobody has seen, so the score should hold up across every family. Axis zoomed to the data.",
      dotPlot({ cats: FAMILIES.map(f => ({ label: f })), series: one(FAMILIES.map(f => S_.by_family[f]?.score_pct ?? null)), labelW: 170 }),
      asTable([{ label: "Family" }, { label: "Score %", num: true }, { label: "Wrong", num: true }], FAMILIES.map(f => [f, p1(S_.by_family[f]?.score_pct), n0(S_.by_family[f]?.wrong || 0)]))));

    const causes = Object.entries(S_.wrong_causes || {}).sort((a, b) => b[1] - a[1]);
    out.push($("div", { class: "grid2" },
      card("Why values are wrong", "Count of wrong values by likely cause.",
        causes.length ? [groupedBars({ cats: causes.map(([c]) => ({ label: c.replaceAll("_", " ") })), series: one(causes.map(([, v]) => v)), fmt: n0, labelW: 130 }),
          asTable([{ label: "Cause" }, { label: "Wrong values", num: true }], causes.map(([c, v]) => [c.replaceAll("_", " "), n0(v)]))]
          : $("p", { class: "empty", text: "No wrong values." })),
      card("Score by document variant", "Perfect documents, documents with planted problems, and mutated layouts. Axis zoomed to the data.",
        dotPlot({ cats: VARIANTS.map(v => ({ label: v })), series: one(VARIANTS.map(v => S_.by_variant[v]?.score_pct ?? null)), labelW: 120 }),
        asTable([{ label: "Variant" }, { label: "Score %", num: true }], VARIANTS.map(v => [v, p1(S_.by_variant[v]?.score_pct)])))));

    const fields = Object.entries(S_.by_field || {});
    const mags = S_.wrong_magnitude || {}, flags = Object.entries(S_.flags || {});
    out.push($("div", { class: "grid2" },
      card("By field", "Outcome per amount column. Click a column to sort.",
        table([{ label: "Field" }, { label: "Correct", num: true }, { label: "Blank", num: true }, { label: "Wrong", num: true }, { label: "Missing", num: true }, { label: "Accuracy", num: true }],
          fields.map(([f, c]) => { const a = pct(c.correct || 0, sum(c, ["correct", "blank", "wrong", "missing"]));
            return [f, n0(c.correct || 0), n0(c.blank || 0), { text: n0(c.wrong || 0), v: c.wrong || 0, cls: c.wrong ? "neg" : "" }, n0(c.missing || 0), { text: p1(a), v: a }]; }), { sortable: true })),
      $("div", {},
        card("How far off the wrong values are", null,
          Object.keys(mags).length ? table([{ label: "Error size" }, { label: "Wrong values", num: true }], ["<=1 EUR", "<=1%", "<=10%", "<=100%", ">100%"].filter(k => mags[k]).map(k => [k, n0(mags[k])]))
            : $("p", { class: "empty", text: "No wrong values." })),
        card("Flags vs the answer key", "Did the output flag what the key flags?",
          flags.length ? table([{ label: "Key flag" }, { label: "Caught", num: true }, { label: "Missed", num: true }, { label: "Extra", num: true }],
            flags.map(([k, c]) => [k, n0(c.caught || 0), { text: n0(c.missed || 0), cls: c.missed ? "neg" : "" }, n0(c.extra || 0)])) : $("p", { class: "empty", text: "No flags." })))));
  }

  const planted = Object.entries(S_.planted || {}).sort();
  out.push($("div", { class: "grid2" },
    card("Checks without an answer key", "These also run on the hidden test set.",
      table([{ label: "Check" }, { label: "Errors", num: true }, { label: "Warnings", num: true }, { label: "Docs with errors", num: true }],
        CHECKS.map(c => [CHECK_LABEL[c], { text: n0(S_.checks?.[c]?.error ?? 0), cls: S_.checks?.[c]?.error ? "neg" : "" }, n0(S_.checks?.[c]?.warn ?? 0), n0(S_.checks?.[c]?.docs_with_errors ?? 0)]))),
    card("Planted problems", "Problems planted in the sample documents: passed / total.",
      planted.length ? table([{ label: "Problem" }, { label: "Passed", num: true }],
        planted.map(([t, c]) => [t.replaceAll("_", " "), { text: plantedCount(c), cls: c.fail ? "neg" : "" }])) : $("p", { class: "empty", text: "No planted problems in these documents." }))));
  return out;
}

function docTable(ids) {
  const headers = [{ label: "Document" }, { label: "Family" }, { label: "Format" }, { label: "Variant" }, { label: "Score %", num: true },
    { label: "Correct", num: true }, { label: "Blank", num: true }, { label: "Wrong", num: true }, { label: "Missing", num: true }, { label: "Check errors", num: true }];
  const rows = ids.map(id => {
    const d = DOCS[id], c = d.counts || {}, errs = docErrors(d);
    return [{ node: $("a", { class: "doclink", href: `#doc/${encodeURIComponent(id)}`, text: id }), v: id }, d.family || "", d.format || "", d.variant || "",
      { text: p1(d.score_pct), v: d.score_pct }, n0(c.correct || 0), n0(c.blank || 0), { text: n0(c.wrong || 0), v: c.wrong || 0, cls: c.wrong ? "neg" : "" },
      n0(c.missing || 0), { text: n0(errs), v: errs, cls: errs ? "neg" : "" }];
  });
  return table(headers, rows, { sortable: true });
}

function pageDocuments() {
  const all = Object.keys(DOCS).sort();
  const opts = (key) => ["", ...new Set(all.map(id => DOCS[id][key]).filter(Boolean))].sort();
  const state = { family: "", format: "", variant: "", q: "" };
  const holder = $("div");
  const render = () => {
    const ids = all.filter(id => { const d = DOCS[id]; return (!state.family || d.family === state.family) && (!state.format || d.format === state.format)
      && (!state.variant || d.variant === state.variant) && (!state.q || id.toLowerCase().includes(state.q.toLowerCase())); });
    holder.replaceChildren($("p", { class: "card-sub", text: `${ids.length} of ${all.length} documents` }), docTable(ids));
  };
  const sel = (key, label) => $("select", { "aria-label": label, onchange: (e) => { state[key] = e.target.value; render(); } },
    opts(key).map(v => $("option", { value: v, text: v ? (key === "format" ? FORMAT_LABEL[v] || v : v) : `All ${label.toLowerCase()}` })));
  render();
  return [$("h1", { text: "Documents" }),
    $("p", { class: "lede", text: "Every document in this run. Click a column to sort, a document to see its wrong values and check errors." }),
    $("div", { class: "filters" }, sel("family", "Families"), sel("format", "Formats"), sel("variant", "Variants"),
      $("input", { type: "search", placeholder: "Search document", "aria-label": "Search document", oninput: (e) => { state.q = e.target.value; render(); } })),
    card("Score per document", null, holder)];
}

function pageDoc(id) {
  const d = DOCS[id];
  if (!d) return [$("h1", { text: "Document not found" })];
  const c = d.counts || {};
  const out = [$("h1", { text: id }),
    $("p", { class: "lede", text: [d.family, FORMAT_LABEL[d.format] || d.format, d.variant, d.values ? `${n0(d.values)} values` : null].filter(Boolean).join(" · ") }),
    $("div", { class: "tiles" },
      tile("Score", d.values ? p1(d.score_pct) : "no key", d.values ? `${n0(d.score)} of ${n0(d.values)}` : ""),
      tile("Wrong values", n0(c.wrong || 0), `${n0(c.blank || 0)} blank · ${n0(c.missing || 0)} missing`),
      tile("Check errors", n0(docErrors(d)), CHECKS.map(ch => `${CHECK_LABEL[ch]} ${n0(d.checks?.[ch]?.error ?? 0)}`).join(" · ")),
      tile("Pointer re-read", `${n0(d.pointer.failed)} failed`, `${n0(d.pointer.verified)} verified · ${n0(d.pointer.unverifiable)} without text layer`))];
  const wrong = [];
  if (d.wrong.length) {
    wrong.push(table([{ label: "Row" }, { label: "Field" }, { label: "Output", num: true }, { label: "Key", num: true }, { label: "Cause" }, { label: "Printed (output)" }, { label: "Printed (key)" }],
      d.wrong.map(w => [w.row, w.field, n0(w.pred), n0(w.key), w.cause.replaceAll("_", " "), w.printed_pred ?? "", w.printed_key ?? ""]), { sortable: true }));
    const more = (c.wrong || 0) - d.wrong.length; if (more > 0) wrong.push($("p", { class: "card-sub", text: `… and ${more} more` }));
  } else wrong.push($("p", { class: "empty", text: "No wrong values." }));
  out.push(card("Wrong values", "Output value against the answer key, with the likely cause.", ...wrong));
  const issues = CHECKS.flatMap(ch => (d.checks?.[ch]?.issues || []).map(x => ({ ch, ...x })));
  out.push(card("Check findings", "Errors and warnings from the checks that need no answer key.",
    issues.length ? issues.slice(0, 40).map(x => $("div", { class: "issue" },
      $("span", { class: "status" }, $("i", { style: `background:${x.severity === "error" ? "var(--critical)" : "var(--warning)"}` }), $("b", { text: x.severity === "error" ? "Error" : "Warning" })),
      ` · ${CHECK_LABEL[x.ch]} · ${[x.row, x.where, x.field].filter(Boolean).join(" · ")} — ${x.message}`))
      : $("p", { class: "empty", text: "No findings." })));
  if (d.planted?.length) out.push(card("Planted problems", null,
    table([{ label: "Problem" }, { label: "Result" }, { label: "Detail" }], d.planted.map(p => [p.type.replaceAll("_", " "),
      { node: $("span", { class: "status" }, $("i", { style: `background:${p.pass ? "var(--good)" : "var(--critical)"}` }), p.pass ? "Pass" : "Fail") }, p.detail]))));
  return out;
}

// ------------------------------------------------------------------ nav + routing
function renderNav(route) {
  const nav = document.getElementById("nav");
  const link = (href, label) => $("a", { href, "aria-current": route === href ? "page" : null, title: label }, label);
  nav.replaceChildren(
    $("div", { class: "brand", text: "Extraction eval" }),
    $("div", { class: "brand-sub", text: RUN.label }),
    link("#overview", "Overview"),
    link("#documents", "Documents"),
    $("div", { class: "side-foot" }, $("span", { text: `Generated ${DATA.generated}` }),
      $("button", { type: "button", text: "Toggle theme", onclick: () => {
        const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
        try { localStorage.setItem("eval-theme", document.documentElement.dataset.theme); } catch (e) {}
      } })));
}
function route() {
  const h = location.hash || "#overview";
  charts.length = 0; hideTip();
  let page, navKey = h;
  if (h === "#documents") page = pageDocuments();
  else if (h.startsWith("#doc/")) { page = pageDoc(decodeURIComponent(h.slice(5))); navKey = "#documents"; }
  else { page = pageOverview(); navKey = "#overview"; }
  document.getElementById("main").replaceChildren(...page.flat());
  renderNav(navKey);
  window.scrollTo(0, 0);
}
try { const t = localStorage.getItem("eval-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
